<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Quality &mdash; PharmaScope</title>
  <link rel="stylesheet" href="shared/style.css">
  <script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/highcharts.js"></script>
  <style>
    .dq-wrap{ max-width:1200px; margin:0 auto; padding:1.5rem 1.5rem 3rem; }
    .dq-status{ padding:.75rem 1rem; border-radius:4px; font-size:.88rem; margin-bottom:1rem; background:rgba(13,148,136,.05); border-left:4px solid var(--teal); color:var(--muted); }
    .dq-toprow{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.75rem; margin-bottom:1.5rem; }
    .dq-metric{ position:relative; background:#fff; border:1px solid var(--border); border-radius:4px; padding:1rem; overflow:hidden; }
    .dq-metric::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--teal); }
    .dq-metric.warn::before{ background:#d97706; }
    .dq-metric.bad::before{ background:#dc2626; }
    .dq-metric .lbl{ font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .dq-metric .val{ font-size:1.5rem; font-weight:700; margin:.2rem 0; }
    .dq-metric .sub{ font-size:.72rem; color:var(--muted); }
    .dq-section{ background:#fff; border:1px solid var(--border); border-radius:4px; padding:1.25rem; margin-bottom:1.25rem; }
    .dq-section h3{ margin:0 0 1rem; font-size:1.05rem; }
    .dq-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
    @media (max-width:768px){ .dq-grid{ grid-template-columns:1fr; } }
    table.dq-tbl{ width:100%; border-collapse:collapse; font-size:.85rem; }
    table.dq-tbl th{ background:#f1f5f9; padding:.5rem .7rem; text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    table.dq-tbl td{ padding:.5rem .7rem; border-bottom:1px solid #f1f5f9; }
    table.dq-tbl td.num, table.dq-tbl td.pct{ text-align:right; font-weight:500; }
    .dq-note{ padding:.6rem .85rem; font-size:.85rem; color:var(--muted); background:#f8fafc; border-left:2px solid var(--border); border-radius:0 3px 3px 0; margin-bottom:1rem; }
  </style>
</head>
<body>
  <div id="site-nav"></div>

  <section class="page-banner">
    <div style="max-width:1200px;margin:0 auto;">
      <h1>Data Quality</h1>
      <p>Every field in the CPP registry inspected for completeness and provenance: how many outlets are geocoded, and where the source data is incomplete.</p>
    </div>
  </section>

  <div class="dq-wrap">
    <div class="dq-status" id="dq-status">Loading&hellip;</div>
    <div class="dq-toprow" id="dq-toprow"></div>

    <div id="dq-details-section">
      <div class="dq-note" id="dq-details-note">Loading detailed breakdown&hellip;</div>
      <div class="dq-section">
        <h3>Field completeness</h3>
        <div class="dq-grid">
          <div id="chart-completeness"></div>
          <div style="max-height:320px;overflow:auto;">
            <table class="dq-tbl" id="dq-completeness-tbl">
              <thead><tr><th>Field</th><th class="num">Filled</th><th class="num">Missing</th><th class="pct">%</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="dq-section">
        <h3>GPS source</h3>
        <div style="max-width:400px;margin:0 auto;">
          <div id="chart-gps-source"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="shared/api.js"></script>
  <script>Auth.requireAuth();</script>
  <script src="shared/nav.js"></script>
  <script src="data-quality.js"></script>
</body>
</html>
