<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &mdash; PharmaScope</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy-dark); }
    .login-card { width: 100%; max-width: 380px; }
    a.back { color: rgba(255,255,255,.6); text-decoration: none; }
    a.back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-sm-5">
        <div class="icon-badge mb-3"><i class="bi bi-shield-lock-fill"></i></div>
        <h1 class="h4 fw-bold mb-1">PharmaScope</h1>
        <p class="text-muted small mb-4">Sign in to access the regulator and data-team tools.</p>
        <div class="alert alert-danger py-2 small d-none" id="err"></div>
        <form id="login-form">
          <div class="mb-3">
            <label for="username" class="form-label small fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" autofocus required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label small fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="submit-btn">Sign in</button>
        </form>
      </div>
    </div>
    <div class="text-center mt-3">
      <a class="back small" href="index.html">&larr; Back to PharmaScope</a>
    </div>
  </div>

  <script src="shared/api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const err = document.getElementById("err");
      err.classList.add("d-none");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        await Auth.login(document.getElementById("username").value, document.getElementById("password").value);
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get("next") || "index.html";
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove("d-none");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
