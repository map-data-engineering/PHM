project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - about.qmd
    - registry.qmd
    - find-pharmacy.qmd
    - find-facility.qmd
    - data-quality.qmd
    - data-sources.qmd
    - team.qmd
    - help.qmd
    - login.qmd
    - logout.qmd
  resources:
    - images/
    - data/tanzania/addo_standardized.csv
    - data/tanzania/boundaries/tza_regions.geojson
    - data/tanzania/boundaries/tza_districts.geojson
    - data/tanzania/boundaries/tza_wards.geojson

website:
  title: "PharmaScope"
  site-url: https://map-data-engineering.github.io/PHM
  back-to-top-navigation: true

  page-footer:
    left: |
      &copy; 2026 PharmaScope &mdash; Malaria Atlas Project, Ifakara Health Institute

      Open pharmacy access intelligence for Tanzania
    background: "#0f172a"
    foreground: light
    border: false

  navbar:
    pinned: true
    search: true
    title: "PharmaScope"
    logo-href: /index.html
    background: "#0f172a"

    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "CPP Registry"
        href: registry.qmd
      - text: "Find Pharmacy"
        href: find-pharmacy.qmd
      - text: "Site Check"
        href: find-facility.qmd
      - text: "Data Quality"
        href: data-quality.qmd
      - text: "Help"
        href: help.qmd

    right:
      - text: "Logout"
        href: logout.qmd

format:
  html:
    theme:
      light: [cosmo, style-base.scss, style-light.scss]
      dark: [darkly, style-base.scss, style-dark.scss]
    toc: false
    link-external-icon: true
    link-external-newwindow: true
    smooth-scroll: true
    # Inline the client-side auth guard into every page. The guard script
    # skips itself on login.html / logout.html and otherwise redirects
    # unauthenticated visitors to login.html?next=<current>. Effect:
    # a fresh visitor landing on the root of the site is sent straight
    # to the login form and only reaches the home page after signing in.
    include-after-body:
      - _auth-guard.html
    grid:
      body-width: 1400px
      sidebar-width: 0px
      margin-width: 0px

execute:
  freeze: auto
